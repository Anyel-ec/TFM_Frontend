<main class="grid min-h-screen place-items-center bg-gray-50 p-6 text-gray-900 dark:bg-gray-950 dark:text-gray-100"><section class="w-full max-w-md rounded-2xl border border-gray-200 bg-white p-8 shadow-xl dark:border-gray-800 dark:bg-gray-900"><div class="mb-8 text-center"><div class="mx-auto grid h-14 w-14 place-items-center rounded-2xl bg-cyan-500/15 text-cyan-600 dark:text-cyan-400"><i class="fas fa-shield-check text-2xl"></i></div><h1 class="mt-4 text-2xl font-bold">TIVA / AssetIntel</h1><p class="mt-1 text-sm text-gray-500">Acceso al Centro de Operaciones de Seguridad</p></div><form (ngSubmit)="login()" class="space-y-5"><label class="block text-sm"><span class="mb-2 block text-gray-500">Usuario</span><input name="username" [(ngModel)]="username" required class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-3 outline-none focus:border-cyan-500 dark:border-gray-700 dark:bg-gray-950"></label><label class="block text-sm"><span class="mb-2 block text-gray-500">Contrasea</span><input name="password" [(ngModel)]="password" type="password" required class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-3 outline-none focus:border-cyan-500 dark:border-gray-700 dark:bg-gray-950"></label><button class="w-full rounded-lg bg-cyan-500 py-3 font-semibold text-gray-950 hover:bg-cyan-400">Iniciar Sesin</button></form></section></main>
